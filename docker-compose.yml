services:
  verify:
    build: .
    image: scalar-autograd-verified:local
    command: sh -c "python -m pytest tests/ -q && python experiments/run_all.py"
    volumes:
      - ./results:/app/results

  tests:
    build: .
    image: scalar-autograd-verified:local
    command: python -m pytest tests/ -q

  experiments:
    build: .
    image: scalar-autograd-verified:local
    command: python experiments/run_all.py
    volumes:
      - ./results:/app/results
